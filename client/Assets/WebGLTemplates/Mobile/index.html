<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0E0E13">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #0E0E13;
        overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Fill the window (or the iframe when embedded). 100dvh avoids mobile URL-bar jumps. */
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; outline: none; background: #0E0E13; }
      #loader {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        font: 700 13px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #fff; letter-spacing: 3px;
      }
      #mark { width: 18px; height: 18px; border-radius: 4px; background: #E20074; }
      #bar { width: min(240px, 60vw); height: 6px; border-radius: 3px; background: #24242E; overflow: hidden; }
      #fill { height: 100%; width: 0; background: #E20074; transition: width .15s; }
      #error { display: none; max-width: 80vw; color: #FF4D5E; text-align: center; letter-spacing: 0; font-weight: 600; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loader">
      <div id="mark"></div>
      <div>SECURITY ARCADE</div>
      <div id="bar"><div id="fill"></div></div>
      <div id="error"></div>
    </div>
    <script>
      (function () {
        var buildUrl = "Build";
        var canvas = document.getElementById("unity-canvas");
        var loader = document.getElementById("loader");
        var fill = document.getElementById("fill");
        var errorBox = document.getElementById("error");

        var config = {
          arguments: [],
          dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
          frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
          workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
          codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
          symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
          streamingAssetsUrl: "StreamingAssets",
          companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
          productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
          productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
          matchWebGLToCanvasSize: true,
          // Phones report DPR 3+; rendering at 2x is visually identical for UI and much cheaper.
          devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        };

        function showError(msg) {
          errorBox.textContent = String(msg);
          errorBox.style.display = "block";
        }

        var script = document.createElement("script");
        script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
        script.onload = function () {
          createUnityInstance(canvas, config, function (p) {
            fill.style.width = Math.round(p * 100) + "%";
          }).then(function (instance) {
            window.unityInstance = instance;
            loader.style.display = "none";
          }).catch(showError);
        };
        script.onerror = function () { showError("Failed to load the game. Check your connection and reload."); };
        document.body.appendChild(script);

        // HostBridge, page -> game. Accepted only from the direct parent frame AND only when the
        // iframe URL names that parent's exact origin (?parentOrigin=https://host.example).
        var parentOrigin = new URLSearchParams(location.search).get("parentOrigin");
        window.addEventListener("message", function (e) {
          if (!parentOrigin || parentOrigin === "*") return;
          if (e.source !== window.parent || e.origin !== parentOrigin) return;
          var d = e.data;
          if (!d || typeof d !== "object" || !window.unityInstance) return;
          if (d.type === "setName" && typeof d.name === "string") {
            window.unityInstance.SendMessage("GameManager", "HostSetName", d.name.slice(0, 20));
          }
        });
      })();
    </script>
  </body>
</html>
